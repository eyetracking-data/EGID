[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gap-imputation-benchmark"
version = "0.1.0"
description = "Reproducible gaze-gap imputation benchmark"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.7",
]
rf = [
    "joblib>=1.3",
    "scikit-learn>=1.3",
]
traffic = [
    "tables>=3.8",
]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gap_imputation_benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
